<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard - Scout Coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .dashboard-container { padding-bottom: 40px; }
    
    /* Tabs System */
    .dashboard-tabs { display: flex; gap: 30px; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dash-tab {
        padding-bottom: 15px; font-size: 14px; font-weight: 700; color: var(--color-scout-silver);
        cursor: pointer; background: none; border: none; position: relative;
    }
    .dash-tab.active { color: var(--color-scout-gold); }
    .dash-tab.active::after {
        content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--color-scout-gold);
    }

    /* List View Styles */
    .talent-item {
      display: flex; align-items: center; gap: 15px; padding: 15px; margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px;
    }
    .talent-item-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: var(--color-scout-surface); }
    .status-badge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.1em; }
    .status-pending { background: rgba(212, 175, 55, 0.1); color: var(--color-scout-gold); }
    .status-published { background: rgba(37, 211, 102, 0.1); color: #25D366; }

    /* Admin Table Styles */
    .admin-table-container { background: rgba(255,255,255,0.02); border-radius: 20px; overflow-x: auto; border: 1px solid rgba(255,255,255,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th { text-align: left; padding: 15px 20px; font-size: 11px; text-transform: uppercase; color: var(--color-scout-silver); border-bottom: 1px solid rgba(255,255,255,0.05); }
    td { padding: 15px 20px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.02); }
    
    .btn-action {
      padding: 6px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase;
      cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
    }
    .btn-approve { background: rgba(37, 211, 102, 0.1); color: #25D366; border-color: rgba(37,211,102,0.2); }
    .btn-reject { background: rgba(255,68,68,0.1); color: #ff4444; border-color: rgba(255,68,68,0.2); }

    /* Form Styles */
    .profile-header-card { padding: 30px 20px; text-align: center; margin-bottom: 30px; border-radius: 24px; }
    .upload-box {
      width: 130px; height: 130px; margin: 0 auto 20px;
      border: 2px dashed rgba(212, 175, 55, 0.3); border-radius: 50%;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3); cursor: pointer;
    }
    .upload-box.has-image { border: 2px solid var(--color-scout-gold); }
    #preview-img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <div id="loading-screen" style="position:fixed; inset:0; background:var(--color-scout-dark); z-index:2000; display:flex; align-items:center; justify-content:center;">
    <div class="animate-pulse" style="width: 40px; height: 40px; border: 3px solid var(--color-scout-gold); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <div class="main-content with-sidebar">
    <div class="container dashboard-container animate-fade-in">
      
      <!-- TABS -->
      <nav class="dashboard-tabs">
          <button class="dash-tab active" id="tab-my-talents">MES DOSSIERS</button>
          <button class="dash-tab" id="tab-admin" style="display: none;">ADMINISTRATION <span style="font-size:10px; opacity:0.6;">(SUPER ADMIN)</span></button>
      </nav>

      <!-- SECTION: MY TALENTS -->
      <section id="section-my-talents">
          <div id="view-list">
            <header style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end;">
              <div>
                <h1 style="font-size: 1.5rem;">Gestion <span class="text-gold-gradient">Talents</span></h1>
                <p style="font-size: 14px; color: var(--color-scout-silver); margin-top: 5px;">Vos CV enregistrés en tant qu'agent.</p>
              </div>
              <button id="btn-add-new" class="btn-gold" style="padding: 12px 20px; font-size: 12px;">+ NOUVEAU</button>
            </header>
            <div id="talents-owner-list"></div>
          </div>

          <div id="view-form" style="display: none;">
            <header style="margin-bottom: 32px; display: flex; align-items: center; gap: 15px;">
               <button id="btn-back" style="background:none; border:none; color:var(--color-scout-gold); cursor:pointer;"><i data-lucide="arrow-left"></i></button>
               <h1 style="font-size: 1.5rem;" id="form-title">Dossier <span class="text-gold-gradient">Coach</span></h1>
            </header>
            
            <div class="agent-card profile-header-card">
              <label class="upload-box" id="upload-area">
                <img id="preview-img" src="" style="display:none;" alt="Preview">
                <div id="upload-content"><i data-lucide="camera" style="width:32px; height:32px; color:var(--color-scout-gold);"></i></div>
                <input type="file" id="image-input" style="display:none;" accept="image/*">
              </label>
              <h2 id="display-name" style="font-size: 1.5rem;">Nom du Coach</h2>
            </div>

            <form id="dashboard-form" class="form-section">
                <input type="hidden" id="coach-id">
                <div class="form-group"><label class="label-gold">Nom Complet</label><input type="text" id="nom" class="input-gold" required></div>
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                    <div class="form-group"><label class="label-gold">Club</label><input type="text" id="club" class="input-gold"></div>
                    <div class="form-group"><label class="label-gold">Spécialité</label><input type="text" id="specialite" class="input-gold"></div>
                </div>
                <div class="form-group"><label class="label-gold">WhatsApp</label><input type="tel" id="telephone" class="input-gold"></div>
                <div class="form-group"><label class="label-gold">Diplôme</label><input type="text" id="diplomes" class="input-gold"></div>
                <div class="form-group">
                    <label class="label-gold">Système Tactique</label>
                    <select id="tactique" class="input-gold" style="appearance:none;"><option value="4-3-3">4-3-3</option><option value="4-2-3-1">4-2-3-1</option><option value="4-4-2">4-4-2</option><option value="3-5-2">3-5-2</option></select>
                </div>
                <div class="form-group"><label class="label-gold">Expérience</label><textarea id="experience" class="input-gold" style="height:100px; resize:none;"></textarea></div>
                <div class="form-group">
                    <label class="label-gold">CV (Format PDF)</label>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="file" id="cv-input" class="input-gold" accept=".pdf" style="padding:10px;">
                        <div id="cv-status" style="font-size:11px; color:#25D366; display:none;"><i data-lucide="check-circle" style="width:14px; height:14px; vertical-align:middle;"></i> Prêt</div>
                    </div>
                </div>
                <div class="form-group"><label class="label-gold">Vision</label><textarea id="bio" class="input-gold" style="height:100px; resize:none;"></textarea></div>
                
                <h3 style="font-size: 1rem; margin: 20px 0 15px; color: var(--color-scout-gold);">Branding & Contenu</h3>
                <div class="form-group"><label class="label-gold">Lien Vidéo Highlights (YouTube Only)</label><input type="url" id="video-url" class="input-gold" placeholder="https://www.youtube.com/watch?v=..."></div>
                
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                    <div class="form-group"><label class="label-gold">Nom de l'Agence</label><input type="text" id="agency-name" class="input-gold"></div>
                    <div class="form-group">
                        <label class="label-gold">Logo de l'Agence</label>
                        <input type="file" id="agency-logo-input" class="input-gold" accept="image/*" style="padding:10px; font-size:10px;">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-gold" style="width:100%;">ENREGISTRER</button>
            </form>
          </div>
      </section>

      <!-- SECTION: ADMIN -->
      <section id="section-admin" style="display: none;">
          <header style="margin-bottom: 32px;">
              <h1 style="font-size: 1.5rem;">Modération <span class="text-gold-gradient">Globale</span></h1>
              <p style="font-size: 14px; color: var(--color-scout-silver); margin-top: 5px;">Validez ou rejetez les demandes de publication.</p>
          </header>
          <div class="admin-table-container">
              <table>
                  <thead><tr><th>Talent</th><th>Propriétaire</th><th>Statut</th><th style="text-align:right;">Actions</th></tr></thead>
                  <tbody id="admin-table-body"></tbody>
              </table>
          </div>
      </section>

    </div>
  </div>

  <script type="module">
    import { initNavigation } from './js/navigation.js';
    initNavigation('profil'); // 'profil' remains the active nav item
  </script>
  <script type="module" src="js/dashboard.js"></script>
  <script>
    window.addEventListener('load', () => { if(window.lucide) lucide.createIcons(); });
  </script>
</body>
</html>

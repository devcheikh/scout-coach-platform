<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fiche Coach - Scout Coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .portfolio-header {
      position: relative;
      padding-top: 20px;
      margin-bottom: 30px;
    }
    .profile-img-lg {
      width: 160px;
      height: 160px;
      margin: 0 auto 24px;
      border: 4px solid var(--color-scout-gold);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
    }
    .profile-img-lg img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .stat-badge {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 16px;
      border-radius: 16px;
      text-align: center;
    }
    .stat-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      display: block;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--color-scout-gold);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .info-section {
      margin-top: 30px;
    }
    .info-card {
      margin-bottom: 20px;
      padding: 30px;
      border-radius: 24px;
    }
    .info-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-scout-gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .info-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(212, 175, 55, 0.2);
    }
    .info-content {
      font-size: 15px;
      line-height: 1.8;
      color: var(--color-scout-silver);
      font-weight: 500;
      white-space: pre-line;
    }
    .action-bar {
      margin-top: 40px;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading-screen" style="position:fixed; inset:0; background:var(--color-scout-dark); z-index:2000; display:flex; align-items:center; justify-content:center;">
    <div class="animate-pulse" style="width: 40px; height: 40px; border: 3px solid var(--color-scout-gold); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  </div>

  <!-- Error -->
  <div id="error-screen" style="display:none; position:fixed; inset:0; background:var(--color-scout-dark); z-index:2000; align-items:center; justify-content:center; padding:24px; text-align:center;">
    <div class="agent-card" style="padding:50px 30px; width:100%; max-width: 400px;">
      <p style="font-size:1.5rem; margin-bottom:24px; font-family: var(--font-heading);">Dossier Inconnu</p>
      <button onclick="window.location.href='browse.html'" class="btn-gold" style="width:100%;">RECHERCHER D'AUTRES TALENTS</button>
    </div>
  </div>

  <div id="content-screen" style="display:none;" class="main-content with-sidebar">
    <div class="container animate-fade-in">
      <div class="portfolio-header">
        <div class="profile-img-lg">
          <img id="display-photo" src="" alt="Coach">
          <div id="photo-placeholder" style="display:none; width:100%; height:100%; background:var(--color-scout-surface); align-items:center; justify-content:center; font-size:4rem;">⚽</div>
        </div>
        
        <div style="text-align: center;">
          <h1 id="display-nom" style="font-size: 2.25rem; margin-bottom: 8px;">Nom du Coach</h1>
          <p id="display-spec" style="font-size: 14px; color: var(--color-scout-silver); font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em;"></p>
          
          <div style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;">
             <span id="display-club" class="talent-tag" style="background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3); font-size: 11px;"></span>
             <div id="agency-badge" style="display:none; align-items:center; gap:8px; padding: 4px 12px; background:rgba(255,255,255,0.03); border-radius:30px; border: 1px solid rgba(255,255,255,0.05);">
                <img id="display-agency-logo" src="" style="width:16px; height:16px; border-radius:2px; object-fit:contain;">
                <span id="display-agency-name" style="font-size:10px; font-weight:700; color:var(--color-scout-silver); text-transform:uppercase;"></span>
             </div>
          </div>
        </div>
      </div>

      <div id="video-section" style="display:none; margin-bottom: 40px;">
          <div class="agent-card" style="padding:0; overflow:hidden; border-radius:24px; aspect-ratio:16/9;">
              <iframe id="display-video" width="100%" height="100%" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px;">
        <div class="stat-badge">
          <span class="stat-label">Système</span>
          <span class="stat-val" id="display-tactique">...</span>
        </div>
        <div class="stat-badge" id="display-licence-container">
          <span class="stat-label">Licence</span>
          <span class="stat-val" id="display-licence" style="font-size: 14px; line-height: 2.2; font-weight: 800;">...</span>
        </div>
      </div>

      <div class="info-section">
        <div class="agent-card info-card">
          <h3 class="info-title">Parcours & Expérience</h3>
          <p id="display-experience" class="info-content"></p>
        </div>

        <div class="agent-card info-card">
          <h3 class="info-title">Philosophie & Vision</h3>
          <p id="display-bio" class="info-content"></p>
        </div>

        <div class="agent-card info-card" id="cv-section" style="display:none;">
          <h3 class="info-title">Dossier Technique</h3>
          <div style="padding-top:10px;">
            <a href="#" id="display-cv" target="_blank" class="btn-outline" style="width:100%; border-style:dashed; color:var(--color-scout-gold); border-color:var(--color-scout-gold); display:flex; align-items:center; justify-content:center; gap:12px;">
              <i data-lucide="file-text"></i> TÉLÉCHARGER LE CV COMPLET (PDF)
            </a>
          </div>
        </div>

        <div class="agent-card info-card">
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
          <a href="#" id="contact-email" class="btn-outline" style="width:100%; border-color: rgba(255,255,255,0.1); color: white; display: flex; align-items: center; justify-content: center; gap: 12px;">
            <i data-lucide="mail" style="width:18px; height:18px;"></i> Email Professionnel
          </a>
          <a href="#" id="contact-whatsapp" class="btn-gold" style="width:100%; background: #25D366; color: white; border: none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); display: flex; align-items: center; justify-content: center; gap: 12px;">
            <i data-lucide="message-circle" style="width:18px; height:18px;"></i> WhatsApp Direct
          </a>
        </div>
      </div>
    </div>

    <div class="action-bar">
        <button onclick="window.print()" class="btn-gold" style="width:100%; padding: 22px; font-weight: 900; letter-spacing: 0.15em;">
          <i data-lucide="download" style="margin-right: 8px;"></i> EXPORTER LE DOSSIER PROFESSIONNEL (PDF)
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initNavigation } from './js/navigation.js';
    initNavigation('none');
  </script>
  <script type="module" src="js/portfolio.js"></script>
</body>
</html>

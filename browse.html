<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Découvrir les Coachs - Scout Coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ===== BACKGROUND PREMIUM ===== */
    body {
      background: #05070a;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(212,175,55,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: orb-move 12s ease-in-out infinite alternate;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(212,175,55,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: orb-move2 15s ease-in-out infinite alternate;
    }
    @keyframes orb-move {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.1); }
    }
    @keyframes orb-move2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-5%, -5%) scale(1.1); }
    }
    .main-content { position: relative; z-index: 1; }

    /* ===== BROWSE HEADER ===== */
    .browse-header {
      padding: 48px 0 32px;
      text-align: center;
    }
    .browse-eyebrow {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: var(--color-scout-gold);
      text-transform: uppercase;
      margin-bottom: 16px;
      opacity: 0.8;
    }
    .browse-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .browse-subtitle {
      font-size: 15px;
      color: rgba(148,163,184,0.7);
      margin-bottom: 36px;
      font-weight: 400;
    }

    /* ===== SEARCH BOX PREMIUM ===== */
    .search-box {
      max-width: 600px;
      margin: 0 auto 36px;
      position: relative;
    }
    .search-box .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-scout-gold);
      opacity: 0.7;
      pointer-events: none;
    }
    .search-box input {
      padding-left: 48px !important;
      border-radius: 50px !important;
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid rgba(212,175,55,0.2) !important;
      font-size: 15px;
      transition: all 0.3s;
    }
    .search-box input:focus {
      border-color: rgba(212,175,55,0.6) !important;
      background: rgba(255,255,255,0.07) !important;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.08);
    }

    /* ===== FILTER SECTION ===== */
    .filter-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 40px;
    }
    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-scout-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-chip {
      white-space: nowrap;
      padding: 8px 18px;
      border-radius: 50px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.1);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-scout-silver);
      transition: all 0.25s;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .filter-chip:hover {
      border-color: rgba(212,175,55,0.3);
      color: var(--color-scout-gold);
    }
    .filter-chip.active {
      background: linear-gradient(135deg, #C5A028, #F4D03F);
      color: #05070a;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }

    /* ===== RESULTS BAR ===== */
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .results-count {
      font-size: 13px;
      color: rgba(148,163,184,0.6);
    }
    .results-count span {
      color: var(--color-scout-gold);
      font-weight: 700;
    }

    /* ===== TALENT GRID ===== */
    #talents-list {
      margin-top: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: var(--color-scout-silver);
      grid-column: 1 / -1;
    }
    .empty-state i { 
      color: rgba(212,175,55,0.2); 
      display: block; 
      margin-bottom: 16px; 
    }
  </style>

</head>
<body>
  <div class="main-content with-sidebar">
    <div class="container animate-fade-in">
      <header class="browse-header">
        <p class="browse-eyebrow">⚽ Réseau d'Excellence</p>
        <h1 class="browse-title">Découvrir les <span class="text-gold-gradient">Talents</span></h1>
        <p class="browse-subtitle">Trouvez les meilleurs entraîneurs et coaches professionnels vérifiés par notre équipe.</p>
        
        <div class="search-box">
          <i data-lucide="search" class="search-icon" style="width:18px; height:18px;"></i>
          <input type="text" id="search-input" class="input-gold" placeholder="Nom, club ou spécialité...">
        </div>
      </header>

      <div class="filter-section">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
          <div>
            <p class="filter-label"><i data-lucide="layout" style="width:12px; height:12px;"></i> Système Tactique</p>
            <div class="filter-scroll" id="filters-tactique">
              <div class="filter-chip active" data-filter="all" data-type="tactique">Tous</div>
              <div class="filter-chip" data-filter="4-3-3" data-type="tactique">4-3-3</div>
              <div class="filter-chip" data-filter="4-2-3-1" data-type="tactique">4-2-3-1</div>
              <div class="filter-chip" data-filter="3-5-2" data-type="tactique">3-5-2</div>
              <div class="filter-chip" data-filter="4-4-2" data-type="tactique">4-4-2</div>
            </div>
          </div>
          <div>
            <p class="filter-label"><i data-lucide="award" style="width:12px; height:12px;"></i> Diplôme / Licence</p>
            <div class="filter-scroll" id="filters-diplome">
              <div class="filter-chip active" data-filter="all" data-type="diplome">Tous</div>
              <div class="filter-chip" data-filter="UEFA Pro" data-type="diplome">UEFA Pro</div>
              <div class="filter-chip" data-filter="UEFA A" data-type="diplome">UEFA A</div>
              <div class="filter-chip" data-filter="UEFA B" data-type="diplome">UEFA B</div>
              <div class="filter-chip" data-filter="FAF" data-type="diplome">FAF</div>
              <div class="filter-chip" data-filter="CAF Pro" data-type="diplome">CAF Pro</div>
            </div>
          </div>
        </div>
      </div>

      <div class="results-bar">
        <p class="results-count">Affichage de <span id="results-count">...</span> talents</p>
      </div>

      <main id="talents-list">
        <div class="agent-card talent-card animate-pulse" style="height: 380px;"></div>
        <div class="agent-card talent-card animate-pulse" style="height: 380px;"></div>
        <div class="agent-card talent-card animate-pulse" style="height: 380px;"></div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initNavigation } from './js/navigation.js';
    initNavigation('explorer');
  </script>
  <script type="module" src="js/browse.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>

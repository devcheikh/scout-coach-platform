<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connexion - Scout Coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent), 
                  radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.05), transparent);
    }
    .login-card {
      width: 100%; max-width: 420px;
      padding: 40px;
    }
    .auth-toggle {
        display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .auth-tab {
        padding-bottom: 12px; font-size: 14px; font-weight: 700; color: var(--color-scout-silver);
        cursor: pointer; position: relative; border: none; background: none;
    }
    .auth-tab.active { color: var(--color-scout-gold); }
    .auth-tab.active::after {
        content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px;
        background: var(--color-scout-gold);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="agent-card login-card animate-fade-in">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="index.html" style="display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700; color:var(--color-scout-gold); text-transform:uppercase; letter-spacing:1px; margin-bottom:24px; text-decoration:none;">
                <i data-lucide="arrow-left" style="width:12px;"></i> Retour à l'accueil
            </a>
            <div style="width: 50px; height: 50px; background: linear-gradient(135deg, var(--color-scout-gold), var(--color-scout-gold-deep)); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
                <i data-lucide="shield-check" style="color: #05070a;"></i>
            </div>
            <h1 style="font-size: 1.5rem;">Espace <span class="text-gold-gradient">Premium</span></h1>
            <p style="font-size: 13px; color: var(--color-scout-silver); margin-top: 8px;">Connectez-vous pour gérer vos talents.</p>
        </div>

        <div class="auth-toggle">
            <button class="auth-tab active" id="tab-login">CONNEXION</button>
            <button class="auth-tab" id="tab-register">INSCRIPTION</button>
        </div>

        <form id="auth-form">
            <div class="form-group">
                <label class="label-gold">Email Professionnel</label>
                <input type="email" id="email" class="input-gold" placeholder="nom@agence.com" required>
            </div>
            <div class="form-group">
                <label class="label-gold">Mot de passe</label>
                <input type="password" id="password" class="input-gold" placeholder="••••••••" required>
            </div>
            
            <button type="submit" id="auth-btn" class="btn-gold" style="width: 100%; margin-top: 10px;">
                <span id="btn-text">SE CONNECTER</span>
            </button>
        </form>

        <p id="auth-error" style="color: #ff4444; font-size: 12px; margin-top: 15px; text-align: center; display: none;"></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-config.js';
    
    const form = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authBtn = document.getElementById('auth-btn');
    const btnText = document.getElementById('btn-text');
    const errorMsg = document.getElementById('auth-error');
    
    let isLogin = true;

    // Toggle Tabs
    document.getElementById('tab-login').onclick = () => {
        isLogin = true;
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        btnText.innerText = "SE CONNECTER";
    };
    document.getElementById('tab-register').onclick = () => {
        isLogin = false;
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        btnText.innerText = "CRÉER MON COMPTE";
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        authBtn.disabled = true;
        errorMsg.style.display = 'none';
        btnText.innerText = "CHARGEMENT...";

        const email = emailInput.value;
        const password = passwordInput.value;

        try {
            if (isLogin) {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
            } else {
                const { error } = await supabase.auth.signUp({ 
                    email, 
                    password,
                    options: { emailRedirectTo: window.location.origin }
                });
                if (error) throw error;
                alert("Inscription réussie ! Vérifiez votre email pour confirmer votre compte.");
                isLogin = true;
                btnText.innerText = "SE CONNECTER";
                authBtn.disabled = false;
                return;
            }
            
            window.location.href = 'dashboard.html';
        } catch (err) {
            errorMsg.innerText = err.message;
            errorMsg.style.display = 'block';
            btnText.innerText = isLogin ? "SE CONNECTER" : "CRÉER MON COMPTE";
            authBtn.disabled = false;
        }
    };

    window.lucide.createIcons();
  </script>
</body>
</html>
